name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 5'

permissions:
  contents: read

jobs:
  matrix-rails-ruby:
    name: Read Rails / Ruby matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read-matrix
        run: echo "matrix=$(yq -o=json -I=0 '.' .github/matrix-rails-ruby.yml)" >> "$GITHUB_OUTPUT"

  tests:
    name: "Rails ${{ matrix.rails-version }} / Ruby ${{ matrix.ruby-version }}"
    needs: [matrix-rails-ruby]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby-version == 'head' || matrix.rails-version == 'edge' }}
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/gemfiles/rails_${{ matrix.rails-version }}.gemfile"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-rails-ruby.outputs.matrix) }}

    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v7

        # https://bundler.io/blog/2018/01/17/making-gem-development-a-little-better.html
      - run: rm Gemfile.lock
      - run: rm gemfiles/*.gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          rubygems: 3.3.27 # last version to support Ruby 2.5
          bundler: latest
          bundler-cache: true

      - run: "bundle exec appraisal rails-${{ matrix.rails-version }} rake spec"